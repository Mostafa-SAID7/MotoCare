<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" fill="#1a1a1a"/>
  
  <!-- Outer circle border -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#ff6b35" stroke-width="8"/>
  
  <!-- Inner circle background -->
  <circle cx="128" cy="128" r="112" fill="#0f0f0f"/>
  
  <!-- Car silhouette simplified -->
  <g transform="translate(128, 128)">
    <!-- Wheels -->
    <circle cx="-35" cy="50" r="20" fill="none" stroke="#ff6b35" stroke-width="6"/>
    <circle cx="-35" cy="50" r="10" fill="none" stroke="#ff6b35" stroke-width="3"/>
    
    <circle cx="35" cy="50" r="20" fill="none" stroke="#ff6b35" stroke-width="6"/>
    <circle cx="35" cy="50" r="10" fill="none" stroke="#ff6b35" stroke-width="3"/>
    
    <!-- Car body main shape -->
    <path d="M -45 30 L -30 -5 L 30 -5 L 45 30 Z" fill="none" stroke="#ff6b35" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Car roof -->
    <path d="M -25 -5 L -15 -25 L 15 -25 L 25 -5 Z" fill="none" stroke="#ff6b35" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Windows -->
    <rect x="-20" y="-20" width="12" height="12" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <rect x="8" y="-20" width="12" height="12" fill="none" stroke="#ff6b35" stroke-width="2"/>
    
    <!-- Front bumper -->
    <line x1="-40" y1="25" x2="40" y2="25" stroke="#ff6b35" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Text arc at top -->
  <defs>
    <path id="topArc" d="M 50,128 A 78,78 0 0,1 206,128" fill="none"/>
    <path id="bottomArc" d="M 206,128 A 78,78 0 0,1 50,128" fill="none"/>
  </defs>
  
  <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff6b35" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      MOTOCARE
    </textPath>
  </text>
  
  <!-- Performance indicator dots -->
  <circle cx="60" cy="128" r="3" fill="#ff6b35"/>
  <circle cx="196" cy="128" r="3" fill="#ff6b35"/>
</svg>